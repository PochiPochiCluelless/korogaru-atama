<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>転がる頭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dcebe6;
    --ground: #2c3e50;
    --ground-dash: #4d647a;
    --ink: #1f2d3a;
    --skin: #f0c9a4;
    --skin-edge: #c9966b;
    --hair: #1b1410;
    --player: #e8553d;
    --player-dark: #a8341f;
    --muted: #4f6a62;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16222a;
      --ground: #0c1419;
      --ground-dash: #2a3b47;
      --ink: #e6f0ec;
      --skin: #e9bf98;
      --skin-edge: #b88458;
      --hair: #0a0706;
      --player: #ff7a5f;
      --player-dark: #c8452c;
      --muted: #8fb0a5;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16222a;
    --ground: #0c1419;
    --ground-dash: #2a3b47;
    --ink: #e6f0ec;
    --skin: #e9bf98;
    --skin-edge: #b88458;
    --hair: #0a0706;
    --player: #ff7a5f;
    --player-dark: #c8452c;
    --muted: #8fb0a5;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  canvas {
    width: 100%;
    max-width: 960px;
    height: auto;
    aspect-ratio: 900 / 400;
    display: block;
  }
  .hint {
    margin: 0;
    padding: 0 16px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>

  var best = 0;
  try { best = parseInt(localStorage.getItem('korogaru-best') || '0', 10) || 0; } catch (e) {}

  var state, player, heads, speed, spawned, score, distSince, nextGap, groundScroll, time, jumpBuffer, shake;

  function reset() {
    state = 'ready';
    player = { y: 0, vy: 0, onGround: true, run: 0 };
    heads = [];
    speed = SPEED_MIN;
    spawned = 0;
    score = 0;
    distSince = 0;
    nextGap = 300;
    groundScroll = 0;
    time = 0;
    jumpBuffer = 0;
    shake = 0;
    previewHead = makeHead();
    lastPortrait = null;
  }
  var previewHead = null, lastPortrait = null;
  reset();

  function progress() { return Math.min(1, spawned / (CLEAR_AT - 1)); }
  function hairLevel(p) { return Math.min(1, p / 0.65); }
  function beardLevel(p) { return Math.max(0, Math.min(1, (p - 0.65) / 0.3)); }

  function stageName(p) {
    if (p < 0.1) return '剛毛';
    if (p < 0.3) return 'ふさふさ';
    if (p < 0.5) return '薄毛';
    if (p < 0.65) return 'ほぼ無毛';
    if (p < 0.75) return 'ツルツル';
    return 'ヒゲハゲ';
  }

  function makeHead() {
    var p = progress();
    var r = 26 + Math.random() * 8;
    var strands = [];
    var n = 110;
    for (var i = 0; i < n; i++) {
      strands.push({
        a: Math.random() * Math.PI * 2,
        t: Math.random() * 0.98,        // この値より進行度が低い間は残る
        l: 12 + Math.random() * 16,
        c: (Math.random() - 0.5) * 10,
        w: 1.8 + Math.random() * 1.6
      });
    }
    var bstrands = [];
    for (var k = 0; k < 70; k++) {
      bstrands.push({
        a: Math.PI * (0.1 + Math.random() * 0.8),
        l: 8 + Math.random() * 14,
        c: (Math.random() - 0.5) * 8,
        w: 2 + Math.random() * 1.6
      });
    }
    return { x: W + r + 10, r: r, ang: Math.random() * 6, level: hairLevel(p), beard: beardLevel(p), strands: strands, bstrands: bstrands, passed: false, p: p };
  }

  function jump() {
    if (state === 'ready') { state = 'play'; }
    if (state === 'over' || state === 'clear') {
      if (time > 0.8) { reset(); state = 'play'; }
      return;
    }
    jumpBuffer = 0.12;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) jump();
    }
  });
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });
  document.body.addEventListener('pointerdown', function (e) { if (e.target !== canvas) jump(); });

  function update(dt) {
    time += dt;
    if (state === 'ready') {
      groundScroll += 120 * dt;
      return;
    }
    if (state === 'over') {
      shake = Math.max(0, shake - dt * 3);
      return;
    }
    if (state === 'clear') {
      groundScroll += 60 * dt;
      return;
    }

    // speed follows baldness
    var target = SPEED_MIN + (SPEED_MAX - SPEED_MIN) * progress();
    speed += (target - speed) * Math.min(1, dt * 1.5);

    // player
    jumpBuffer -= dt;
    if (player.onGround && jumpBuffer > 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      jumpBuffer = 0;
    }
    if (!player.onGround) {
      player.vy -= GRAVITY * dt;
      player.y += player.vy * dt;
      if (player.y <= 0) { player.y = 0; player.vy = 0; player.onGround = true; }
    }
    player.run += dt * speed * 0.03;

    groundScroll += speed * dt;

    // spawn
    distSince += speed * dt;
    if (spawned < CLEAR_AT && distSince >= nextGap) {
      heads.push(makeHead());
      spawned++;
      distSince = 0;
      nextGap = speed * 0.62 + 130 + Math.random() * 230;
    }

    // heads
    for (var i = heads.length - 1; i >= 0; i--) {
      var h = heads[i];
      h.x -= speed * dt;
      h.ang -= (speed / h.r) * dt;
      if (!h.passed && h.x + h.r < PX - 17) { h.passed = true; score++; }
      if (h.x + h.r < -20) heads.splice(i, 1);
    }

    if (score >= CLEAR_AT) {
      state = 'clear';
      time = 0;
      if (score > best) {
        best = score;
        try { localStorage.setItem('korogaru-best', String(best)); } catch (e) {}
      }
      return;
    }

    // collision (circle vs shrunken rect)
    var pl = PX - 12, pr = PX + 12;
    var pb = GROUND - player.y - 4, pt = GROUND - player.y - 54;
    for (var j = 0; j < heads.length; j++) {
      var hd = heads[j];
      var cx = hd.x, cy = GROUND - hd.r;
      var nx = Math.max(pl, Math.min(cx, pr));
      var ny = Math.max(pt, Math.min(cy, pb));
      var dx = cx - nx, dy = cy - ny;
      if (dx * dx + dy * dy < (hd.r - 4) * (hd.r - 4)) {
        state = 'over';
        time = 0;
        shake = 1;
        if (score > best) {
          best = score;
          try { localStorage.setItem('korogaru-best', String(best)); } catch (e) {}
        }
        break;
      }
    }
  }

  function drawHead(h, px, py, ang, k) {
    if (px === undefined) { px = h.x; py = GROUND - h.r; ang = h.ang; k = 1; }
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(k, k);

    // hair (rotating with head)
    ctx.save();
    ctx.rotate(ang);
    ctx.strokeStyle = css['hair'];
    ctx.lineCap = 'round';
    for (var i = 0; i < h.strands.length; i++) {
      var s = h.strands[i];
      if (s.t <= h.level) continue;
      var cx = Math.cos(s.a), cy2 = Math.sin(s.a);
      var x0 = cx * (h.r - 2), y0 = cy2 * (h.r - 2);
      var len = s.l * (h.level < 0.12 ? 1.2 : 1);
      var x1 = cx * (h.r + len), y1 = cy2 * (h.r + len);
      var mx = (x0 + x1) / 2 - cy2 * s.c, my = (y0 + y1) / 2 + cx * s.c;
      ctx.lineWidth = s.w;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(mx, my, x1, y1);
      ctx.stroke();
    }

    // skull
    ctx.fillStyle = css['skin'];
    ctx.strokeStyle = css['skin-edge'];
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, h.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // beard
    if (h.beard > 0) {
      var b = h.beard, R = h.r;
      ctx.fillStyle = css['hair'];
      ctx.strokeStyle = css['hair'];
      ctx.lineCap = 'round';
      for (var q = 0; q < h.bstrands.length; q++) {
        var bs = h.bstrands[q];
        var bx = Math.cos(bs.a), by = Math.sin(bs.a);
        var len = bs.l * b;
        var ax = bx * (R - 2), ay = by * (R - 2);
        var ex = bx * (R + len), ey = by * (R + len);
        ctx.lineWidth = bs.w;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo((ax + ex) / 2 - by * bs.c, (ay + ey) / 2 + bx * bs.c, ex, ey);
        ctx.stroke();
      }
      var a0 = Math.PI * 0.08, a1 = Math.PI * 0.92;
      ctx.beginPath();
      ctx.arc(0, 0, R - 1, a0, a1);
      ctx.quadraticCurveTo(0, R * (1.45 - 1.3 * b), Math.cos(a0) * (R - 1), Math.sin(a0) * (R - 1));
      ctx.closePath();
      ctx.fill();
      if (b > 0.35) {
        ctx.globalAlpha = Math.min(1, (b - 0.35) / 0.4);
        ctx.beginPath();
        ctx.ellipse(-R * 0.2, R * 0.4, R * 0.24, R * 0.07, 0.3, 0, Math.PI * 2);
        ctx.ellipse(R * 0.2, R * 0.4, R * 0.24, R * 0.07, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // thick hair cover on top at the start
    if (h.level < 0.5) {
      var cover = 1 - h.level / 0.5;
      ctx.fillStyle = css['hair'];
      ctx.globalAlpha = Math.min(1, cover * 1.1);
      ctx.beginPath();
      ctx.arc(0, 0, h.r - 1, -Math.PI * 0.95, -Math.PI * 0.05);
      ctx.arc(0, 0, h.r - 1 - cover * 9, -Math.PI * 0.05, -Math.PI * 0.95, true);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // face
    var er = h.r * 0.13;
    ctx.fillStyle = css['hair'];
    ctx.beginPath(); ctx.arc(-h.r * 0.34, h.r * 0.02, er, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(h.r * 0.34, h.r * 0.02, er, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = css['hair'];
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, h.r * 0.62, h.r * 0.28, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    // brows
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-h.r * 0.5, -h.r * 0.22); ctx.lineTo(-h.r * 0.2, -h.r * 0.12);
    ctx.moveTo(h.r * 0.5, -h.r * 0.22); ctx.lineTo(h.r * 0.2, -h.r * 0.12);
    ctx.stroke();
    ctx.restore();

    // shine (does not rotate) — grows as hair disappears
    if (h.level > 0.55) {
      var a = Math.min(1, (h.level - 0.55) / 0.4);
      ctx.save();
      ctx.globalAlpha = 0.85 * a;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-h.r * 0.42, -h.r * 0.5, h.r * 0.2, h.r * 0.11, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPlayer() {
    var x = PX, y = GROUND - player.y;
    var air = !player.onGround;
    var swing = air ? 0 : Math.sin(player.run * 2) * 8;
    ctx.save();
    ctx.lineCap = 'round';
    // legs
    ctx.strokeStyle = css['player-dark'];
    ctx.lineWidth = 6;
    ctx.beginPath();
    if (air) {
      ctx.moveTo(x - 3, y - 18); ctx.lineTo(x - 12, y - 8);
      ctx.moveTo(x + 3, y - 18); ctx.lineTo(x + 12, y - 12);
    } else {
      ctx.moveTo(x - 3, y - 18); ctx.lineTo(x - 3 + swing, y);
      ctx.moveTo(x + 3, y - 18); ctx.lineTo(x + 3 - swing, y);
    }
    ctx.stroke();
    // body
    ctx.fillStyle = css['player'];
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - 13, y - 44, 26, 28, 8); else ctx.rect(x - 13, y - 44, 26, 28);
    ctx.fill();
    // arms
    ctx.strokeStyle = css['player-dark'];
    ctx.lineWidth = 5;
    ctx.beginPath();
    if (air) {
      ctx.moveTo(x - 12, y - 38); ctx.lineTo(x - 22, y - 54);
      ctx.moveTo(x + 12, y - 38); ctx.lineTo(x + 22, y - 54);
    } else {
      ctx.moveTo(x - 12, y - 38); ctx.lineTo(x - 14 - swing * 0.6, y - 26);
      ctx.moveTo(x + 12, y - 38); ctx.lineTo(x + 14 + swing * 0.6, y - 26);
    }
    ctx.stroke();
    // head
    ctx.fillStyle = css['skin'];
    ctx.strokeStyle = css['skin-edge'];
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y - 56, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = css['hair'];
    ctx.beginPath(); ctx.arc(x + 4, y - 57, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 9, y - 57, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawText(txt, x, y, size, weight, color, align) {
    ctx.font = weight + ' ' + size + 'px "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y);
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);

    ctx.fillStyle = css['bg'];
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // ground
    ctx.fillStyle = css['ground'];
    ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
    ctx.fillStyle = css['ground-dash'];
    var step = 70, off = groundScroll % step;
    for (var gx = -off; gx < W + step; gx += step) ctx.fillRect(gx, GROUND + 22, 30, 4);

    for (var i = 0; i < heads.length; i++) drawHead(heads[i]);
    drawPlayer();
    ctx.restore();

    // HUD
    var p = progress();
    drawText(String(score), W - 24, 34, 34, 900, css['ink'], 'right');
    drawText('ベスト ' + best, W - 24, 64, 14, 500, css['muted'], 'right');
    // portrait: upright face of the next head coming at you
    var pt = null;
    for (var qi = 0; qi < heads.length; qi++) { if (!heads[qi].passed) { pt = heads[qi]; break; } }
    if (pt) lastPortrait = pt;
    var shown = pt || lastPortrait || previewHead;
    if (state === 'ready') shown = previewHead;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = css['bg'];
    ctx.beginPath(); ctx.arc(68, 68, 60, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    drawHead(shown, 68, 68, 0, 26 / shown.r);
    if (state === 'play' || state === 'over') {
      drawText(stageName(shown.p), 148, 34, 22, 900, css['ink'], 'left');
      ctx.fillStyle = css['ground-dash'];
      ctx.globalAlpha = 0.35;
      ctx.fillRect(148, 56, 140, 6);
      ctx.globalAlpha = 1;
      ctx.fillStyle = css['player'];
      ctx.fillRect(148, 56, 140 * shown.p, 6);
    }

    if (state === 'ready') {
      drawText('転がる頭', W / 2, 120, 54, 900, css['ink']);
      drawText('最初は剛毛。避けるほど毛が減って、速くなる。' + CLEAR_AT + '個避けたらクリア。', W / 2, 170, 17, 500, css['muted']);
      if (Math.floor(time * 1.6) % 2 === 0) drawText('Enter でスタート', W / 2, 225, 24, 900, css['player']);
    }
    if (state === 'clear') {
      ctx.fillStyle = css['bg'];
      ctx.globalAlpha = 0.94;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      var isz = H - 24;
      if (endingImage && endingImage.complete && endingImage.naturalWidth) {
        ctx.drawImage(endingImage, 24, 12, isz, isz);
      }
      var tx = 24 + isz + 28 + (W - (24 + isz + 28) - 24) / 2;
      drawText('クリア!', tx, 90, 30, 900, css['muted']);
      drawText('今日から君も', tx, 170, 26, 900, css['ink']);
      drawText('HAGESOPHIA!!', tx, 222, 40, 900, css['player']);
      drawText('ベスト ' + best, tx, 290, 14, 500, css['muted']);
      if (time > 0.8 && Math.floor(time * 1.6) % 2 === 0) drawText('Enter でもう一度', tx, 340, 18, 900, css['ink']);
    }
    if (state === 'over') {
      ctx.fillStyle = css['bg'];
      ctx.globalAlpha = 0.72;
      ctx.fillRect(0, 70, W, 170);
      ctx.globalAlpha = 1;
      drawText('愚かものめ!', W / 2, 112, 48, 900, css['ink']);
      drawText(score + ' / ' + CLEAR_AT + ' 個避けた(' + stageName(p) + 'まで到達)', W / 2, 160, 19, 500, css['ink']);
      if (time > 0.5 && Math.floor(time * 1.6) % 2 === 0) drawText('Enter でもう一度', W / 2, 205, 22, 900, css['player']);
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
